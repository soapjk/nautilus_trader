name: Sync official upstream

on:
  schedule:
    - cron: "17 20 * * *" # Daily at 04:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'soapjk/nautilus_trader' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge official develop without discarding fork changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/soapjk/nautilus_trader/merge-upstream \
            -f branch=develop
